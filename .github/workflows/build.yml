# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -warnaserror
    - name: Test
      run: dotnet test --no-build --verbosity normal

  # The oldest SDK consumers may use: fails with CS9057 if the generator's Roslyn outgrows it.
  # SDK 10 cannot target net11.0, so this job pins global.json to it and builds net10.0 only.
  build-minimum-sdk:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.401
    - name: Pin global.json to the minimum SDK
      run: |
        jq '.sdk = {"version": "10.0.401", "rollForward": "latestPatch"}' global.json > global.json.tmp
        mv global.json.tmp global.json
    - name: Restore dependencies
      run: dotnet restore -p:OutboxTargetFrameworks=net10.0
    - name: Build
      run: dotnet build --no-restore -warnaserror -p:OutboxTargetFrameworks=net10.0
    - name: Test source generator
      run: dotnet test --no-build --project test/Underground.Outbox.SourceGeneratorTest/Underground.Outbox.SourceGeneratorTest.csproj -p:OutboxTargetFrameworks=net10.0
